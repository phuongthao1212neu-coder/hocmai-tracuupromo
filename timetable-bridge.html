<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu lịch học — HOCMAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      min-height: 100vh; display:flex; align-items:center; justify-content:center;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 40px;
      max-width: 480px; width: 90%; text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.15);
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    .title { font-size: 22px; font-weight: 800; color: #0F172A; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #64748B; margin-bottom: 28px; }
    .hint-box {
      display: flex; align-items: center; gap: 10px;
      background: #EFF6FF; border: 2px solid #BFDBFE;
      border-radius: 12px; padding: 16px 20px; margin-bottom: 12px;
      font-size: 15px; font-weight: 600; color: #1E40AF;
      justify-content: center; flex-wrap: wrap;
    }
    .hint-box .icon { font-size: 22px; }
    .hint-box .cred { font-family: 'Courier New', monospace; background: rgba(37,99,235,.1); padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px; }
    .desc { font-size: 13px; color: #94A3B8; margin-bottom: 20px; line-height: 1.5; }
    .btn-go {
      display: inline-block; padding: 14px 40px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
      text-decoration: none; transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(37,99,235,.3);
      margin-bottom: 16px;
    }
    .btn-go:hover { transform: scale(1.04); box-shadow: 0 6px 24px rgba(37,99,235,.4); }
    .countdown-text { font-size: 14px; color: #64748B; }
    .countdown-text span { font-weight: 700; color: #2563EB; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📅</div>
    <div class="title">Tra cứu lịch học</div>
    <div class="subtitle">Hệ thống nội bộ HOCMAI</div>
    <div class="hint-box">
      <span class="icon">👤</span>
      <span id="hintText"></span>
    </div>
    <p class="desc">Lần đầu sử dụng, vui lòng đăng nhập bằng tài khoản bên trên.<br>Sau khi đăng nhập, trình duyệt sẽ tự ghi nhớ cho lần sau.</p>
    <a class="btn-go" id="btnGo" href="https://tra-cuu-lich-hoc.vercel.app/timetable">🔗 Mở trang lịch học ngay</a>
    <p class="countdown-text">Tự động chuyển sau <span id="countdown">5</span> giây...</p>
  </div>

  <script>
    (function() {
      var TIMETABLE = 'https://tra-cuu-lich-hoc.vercel.app/timetable';
      var params = new URLSearchParams(location.search);
      var role = params.get('role') || 'tvv';
      var creds = {
        tvv: { user: 'tvv', pass: 'Hocmai@112233' },
        ds:  { user: 'adc', pass: 'adc2026' }
      };
      var c = creds[role] || creds.tvv;

      function redirect() {
        window.location.href = TIMETABLE;
      }

      function showHintAndCountdown() {
        document.getElementById('hintText').innerHTML =
          'Đăng nhập: <span class="cred">' + c.user + '</span> / <span class="cred">' + c.pass + '</span>';

        var sec = 5;
        var cd = document.getElementById('countdown');
        var timer = setInterval(function() {
          sec--;
          if (sec <= 0) { clearInterval(timer); redirect(); }
          else { cd.textContent = sec; }
        }, 1000);
      }

      // First visit ever → show hint + 5s countdown. After that → go straight.
      if (localStorage.getItem('tt_visited')) {
        redirect();
      } else {
        localStorage.setItem('tt_visited', '1');
        showHintAndCountdown();
      }
    })();
  </script>
</body>
</html>
